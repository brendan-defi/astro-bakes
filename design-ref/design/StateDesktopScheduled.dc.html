<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Astro Bakes — desktop homepage, drop scheduled</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Titan+One&family=Pacifico&family=Zen+Maru+Gothic:wght@500;700;900&display=swap">
<style>
body{margin:0;background:#2A1B5E}
@keyframes ab-ticker{from{transform:translateX(0)}to{transform:translateX(-33.333%)}}
@keyframes ab-bob{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-8px) rotate(2deg)}}
@keyframes ab-spin{from{transform:rotate(0)}to{transform:rotate(360deg)}}
@media (prefers-reduced-motion: reduce){*{animation:none !important}}
</style>
</helmet>
<dc-import name="FunStates" state="scheduled" ordered="{{false}}" hint-size="100%,3500px"></dc-import>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":3500}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
